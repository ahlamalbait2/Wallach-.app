name: Build Wallach APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show initial contents
        run: ls -la

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Extract text from PDF
        run: python scripts/extract_pdf.py

      - name: Build SQLite database
        run: python scripts/build_db.py

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create ALL config files programmatically
        run: |
          cat > package.json << 'EOF'
          {
            "name": "wallachapp",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^6.1.0",
              "@capacitor/core": "^6.1.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^6.1.0",
              "sql.js": "^1.10.3"
            }
          }
          EOF

          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.wallach.tests",
            "appName": "Wallach Tests",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

          echo "=== Files created ==="
          ls -la
          echo "=== package.json ==="
          cat package.json
          echo "=== capacitor.config.json ==="
          cat capacitor.config.json

      - name: Install Node dependencies
        run: npm install

      - name: Verify sql.js exists
        run: |
          ls -la node_modules/sql.js/dist/
          echo "Checking for sql-wasm.js..."
          test -f node_modules/sql.js/dist/sql-wasm.js && echo "sql-wasm.js FOUND" || echo "sql-wasm.js MISSING"
          test -f node_modules/sql.js/dist/sql-wasm.wasm && echo "sql-wasm.wasm FOUND" || echo "sql-wasm.wasm MISSING"

      - name: Copy files to www folder
        run: |
          mkdir -p www
          cp node_modules/sql.js/dist/sql-wasm.js www/
          cp node_modules/sql.js/dist/sql-wasm.wasm www/
          cp wallach.sqlite www/
          echo "=== www contents ==="
          ls -la www/

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wallach-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
