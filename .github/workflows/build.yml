name: Build Wallach APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show workspace contents
        run: |
          echo "Current directory: $(pwd)"
          ls -la

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Extract text from PDF
        run: python scripts/extract_pdf.py

      - name: Build SQLite database
        run: python scripts/build_db.py

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create package.json on the fly
        run: |
          cat > package.json << 'PKGEOF'
          {
            "name": "wallachapp",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^6.1.0",
              "@capacitor/core": "^6.1.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^6.1.0",
              "sql.js": "^1.10.3"
            }
          }
          PKGEOF
          echo "=== package.json created: ==="
          cat package.json
          echo "=== Directory contents: ==="
          ls -la

      - name: Install Node dependencies
        run: |
          echo "pwd: $(pwd)"
          npm install

      - name: Prepare www folder
        run: |
          cp node_modules/sql.js/dist/sql-wasm.js www/
          cp node_modules/sql.js/dist/sql-wasm.wasm www/
          cp wallach.sqlite www/

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wallach-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
